name: Publish to NPM

on:
  workflow_call:
    inputs:
      package-filter:
        description: 'Optional pnpm selector for monorepos, e.g. @scope/pkg or ./packages/pkg. Leave empty for single-package repos.'
        required: false
        type: string
        default: ''
      node-version:
        description: 'Node.js version to use'
        required: false
        type: string
        default: '24'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          runtime: node@${{ inputs.node-version }}
          cache: true

      - name: Publish to NPM
        env:
          PACKAGE_FILTER: ${{ inputs.package-filter }}
        run: |
          if [ -n "$PACKAGE_FILTER" ]; then
            pnpm publish --filter "$PACKAGE_FILTER" --provenance
          else
            pnpm publish --provenance
          fi
